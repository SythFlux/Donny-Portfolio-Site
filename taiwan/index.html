<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DTDVO — Taiwan</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- Cinematic Overlays -->
  <div id="cinematic-vignette"></div>
  <div class="crosshair top-left"></div>
  <div class="crosshair top-right"></div>
  <div class="crosshair bottom-left"></div>
  <div class="crosshair bottom-right"></div>
  
  <header id="top-hud">
    <div class="hud-left">
      <span class="rec-dot"></span> REC
      <span class="timecode">00:00:24:12</span>
    </div>
    <div class="hud-center">
    </div>
    <div class="hud-right">
      <span class="data-block">F/2.0</span>
      <span class="data-block">ISO 100</span>
      <span class="data-block">4K 120FPS</span>
    </div>
  </header>

  <div id="viewer">
    <div id="page-fade" class="visible"></div>
  </div>
  <section id="timeline" aria-hidden="false">
    <div class="tl-inner">
      <div class="track">
        <div class="track-line"></div>
        <div class="track-marker" aria-hidden="true"></div>
        <div class="items">
          <!-- Dynamically generated by JS -->
        </div>
      </div>
    </div>
  </section>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
